<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="calculadora.php">
    <title>Calculadora Profesional</title>
    <style>
        /* Estilos para el fondo y el contenedor */
        body {
            background-color: #333;
            color: #FFF;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .calculadora {
            background-color: #111;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.5);
            width: 300px;
            text-align: center;
        }

        .calculadora h2 {
            color: #ff3333;
        }

        /* Estilos para los inputs y botones */
        .calculadora input[type="number"], .calculadora select {
            width: 80%;
            padding: 10px;
            margin: 10px 0;
            font-size: 16px;
            border-radius: 4px;
            border: none;
            outline: none;
        }

        .calculadora button {
            width: 85%;
            padding: 10px;
            background-color: #ff3333;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s ease;
        }

        .calculadora button:hover {
            background-color: #e60000;
        }

        .resultado {
            margin-top: 15px;
            font-size: 18px;
            color: #ff3333;
        }
    </style>
</head>
<body>
    <div class="calculadora">
        <h2>Calculadora Profesional</h2>
        <form method="post" action="">
            <input type="number" name="num1" placeholder="Número 1" step="any" required>
            <select name="operacion">
                <option value="sumar">Sumar</option>
                <option value="restar">Restar</option>
                <option value="multiplicar">Multiplicar</option>
                <option value="dividir">Dividir</option>
            </select>
            <input type="number" name="num2" placeholder="Número 2" step="any" required>
            <button type="submit" name="calcular">Calcular</button>
        </form>

        
    </div>
</body>
</html>
